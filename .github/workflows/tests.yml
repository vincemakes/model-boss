name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # The suite is currently verified green on macOS + Python 3.13. Four
    # resource/setup tests depend on Linux platform behavior (inode reuse,
    # HOME semantics, preflight fixtures) and one depends on pathlib's
    # pre-3.13 symlink-loop exception. Broader portability is tracked
    # separately; this job mirrors the verified environment.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 -m pip install pyyaml
      - run: bash scripts/validate.sh
