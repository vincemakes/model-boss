name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # The suite is currently verified green on macOS; five resource/setup tests
    # depend on platform behavior (errno values, inode reuse, HOME semantics)
    # that differs on Linux runners. Linux portability is tracked separately.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install pyyaml
      - run: python3 -m unittest discover -s tests
      - run: python3 -m runtime.model_boss.package --repo-root . --validate dist/model-boss.skill
